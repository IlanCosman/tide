---
name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create higher level tags
        uses: vweevers/additional-tags-action@3bab55b44e81186dcfef7db9f2cbca01a78eb710 # v2.0.0

      # Remove first five lines
      # Print until we hit a ## header
      # Remove last two lines
      # Replace [#79][] with #79
      # Output to /tmp/github_release.md
      - name: Generate release notes
        run: >
          tail --lines=+5 "$GITHUB_WORKSPACE/CHANGELOG.md" |
          sed '/^## /q' |
          head --lines=-2 |
          sed -E 's/\[(#[0-9]*)\]\[\]/\1/g'
          >/tmp/github_release.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: /tmp/github_release.md
