---
name: release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # additional-tags-action runs git push, which needs these credentials
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Create higher level tags
        uses: vweevers/additional-tags-action@3bab55b44e81186dcfef7db9f2cbca01a78eb710 # v2.0.0

      # Remove first five lines
      # Print until we hit a ## header
      # Remove last two lines
      # Replace [#79][] with #79
      # Output to /tmp/github_release.md
      - name: Generate release notes
        run: >
          tail --lines=+5 "$GITHUB_WORKSPACE/CHANGELOG.md" |
          sed '/^## /q' |
          head --lines=-2 |
          sed -E 's/\[(#[0-9]*)\]\[\]/\1/g'
          >/tmp/github_release.md

      # Keep this action until a gh release step is tested on a real release
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with: # zizmor: ignore[superfluous-actions]
          body_path: /tmp/github_release.md
